databaseChangeLog:
  - changeSet:
      id: create-items-table
      author: arsshark
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_items
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: add-items-constraints
      author: arsshark
      changes:
        # A SQL change instead of addCheckConstraint, which needs a paid Liquibase license.
        - sql:
            dbms: postgresql
            sql: ALTER TABLE items ADD CONSTRAINT ck_items_price_non_negative CHECK (price >= 0)

  - changeSet:
      id: create-items-indexes
      author: arsshark
      changes:
        - createIndex:
            indexName: idx_items_name
            tableName: items
            columns:
              - column:
                  name: name
