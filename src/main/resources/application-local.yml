# Profile "local": the application runs on the host (IDE or .\mvnw spring-boot:run),
# PostgreSQL is reachable on localhost. Environment variables override every default.
# Credentials (DB_USERNAME, DB_PASSWORD) have no defaults and are never stored in this file.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:order_service_db}
  kafka:
    # The broker of the Compose file of the Payment Service, published on the loopback interface.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app:
  security:
    # The internal address of the Authentication Service, never the address of the API Gateway.
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  user-service:
    # The internal address of the User Service, never the address of the API Gateway.
    base-uri: ${USER_SERVICE_URI:http://localhost:8082}
