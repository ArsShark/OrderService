spring:
  application:
    name: order-service
  profiles:
    # Used when no profile is set (IDE, .\mvnw spring-boot:run).
    default: local
  datasource:
    # The URL is defined per profile (application-local.yml).
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Lazy collections and references of a page of orders are loaded for up to 50 owners at
        # once (one query per level) instead of one query per order: no N+1.
        default_batch_fetch_size: 50
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    web:
      pageable:
        # Spring caps a larger "size" silently; the API promises at most 100 per page.
        max-page-size: 100
  kafka:
    # The address of the broker is defined per profile (application-local.yml and -docker.yml).
    consumer:
      # All instances of this service form one group: a partition is read by one of them.
      group-id: order-service
      # Where a group starts when it has no committed position yet (the first start): at the
      # beginning, so a payment that was made before this service ran is not lost.
      auto-offset-reset: earliest
      # The container commits the position itself, after every record (see ack-mode).
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns a record that cannot be read into a failure that the
      # error handler sees, instead of an endless loop on the same record. The class that does
      # the reading is the delegate.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The events carry no Java type: this service reads them as its own copy of the event.
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": com.innowise.orderservice.dto.event.PaymentEvent
        "[spring.json.trusted.packages]": com.innowise.orderservice.dto.event
    listener:
      # The position of a record is committed after the listener has handled it.
      ack-mode: record
      # One thread reads all three partitions. Events of one order stay in order anyway.
      concurrency: 1
      # Both services declare payment-events. If the broker was not reachable when this service
      # started, the topic is missing until the next start: the listener waits for it instead of
      # stopping.
      missing-topics-fatal: false
server:
  port: ${SERVER_PORT:8083}
  # The services are reachable only inside the network, so they may trust the X-Forwarded-*
  # headers of the API Gateway: the Location of a created resource points to the Gateway.
  forward-headers-strategy: framework
app:
  internal:
    # The shared key of the internal endpoints of the other services (the header X-Internal-Key).
    # It has no default: an empty value stops the startup.
    api-key: ${INTERNAL_API_KEY}
  security:
    # Must equal the issuer of the Authentication Service (JWT_ISSUER there).
    jwt-issuer: ${JWT_ISSUER:authentication-service}
logging:
  level:
    # At WARN Hibernate logs the DETAIL of a failed statement, which holds real emails.
    org.hibernate.orm.jdbc.error: ERROR
    # The Kafka client logs every configuration value at INFO, again for every client.
    org.apache.kafka: WARN
